<!DOCTYPE html>

<html>

<head>

<title>Trainer Data</title>

<link rel="stylesheet"

href="{{ url_for('static',filename='css/style.css') }}">

</head>

<body>

<header>

<img class="logo"

src="{{ url_for('static',filename='images/technology logo.jpg') }}">

<nav>

<ul>

<li><a href="/">HOME</a></li>

<li><a href="/trainer_data">ALNAFI TSHEET</a></li>

<li><a href="/trainer">TRAINER</a></li>

<li><a href="/trainer_data">DISPLAY</a></li>

</ul>

</nav>

</header>

<div class="table-box">

<h1>Trainer Course Details</h1>

<form action="/trainer_data"

method="POST">

<label>Course</label>

<select name="course">

<option value="All">All</option>

<option value="AI">AI</option>

<option value="Linux">Linux</option>

<option value="Python">Python</option>

<option value="DevOps">DevOps</option>

</select>

<button type="submit">

Search

</button>

</form>

<br>

<table>

<tr>

<th>ID</th>

<th>First Name</th>

<th>Last Name</th>

<th>Designation</th>

<th>Course</th>

</tr>

{% for row in output_data %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
